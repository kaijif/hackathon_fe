services:
  db:
    image: postgres:16-alpine
    container_name: nightwatch-db
    environment:
      POSTGRES_USER: nightwatch
      POSTGRES_PASSWORD: nightwatch
      POSTGRES_DB: nightwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightwatch -d nightwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: nightwatch-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://nightwatch:nightwatch@db:5432/nightwatch?sslmode=disable"
      MONITOR_ENABLED: "true"
      MONITOR_TICK: "30s"
      LOG_LEVEL: "info"
    ports:
      - "8080:8080"

volumes:
  pgdata:
